[project]
name = "mag"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy",
  # 必要ならここに他の依存を書いてOK
  "torch==2.0.1",
  "torchvision==0.15.2",
  "torchaudio==2.0.2",
]

# torch系は必ず PyTorch cu117 index から取る（PyPIに逃がさない）
[tool.uv.sources]
torch = { index = "pytorch-cu117" }
torchvision = { index = "pytorch-cu117" }
torchaudio = { index = "pytorch-cu117" }

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
